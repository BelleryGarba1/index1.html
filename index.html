<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NAHAD NOTES</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f6;--panel:#fff;--ink:#1b2433;--mute:#64708a;--line:#d9dfe9;--acc:#0f766e;--accbg:#d9f1ee;--warn:#b42318;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#10151f;--panel:#171e2b;--ink:#e6ebf5;--mute:#8d99b3;--line:#2a3345;--acc:#4fd1c5;--accbg:#173a3a;--warn:#f97066}}
:root[data-theme=dark]{--bg:#10151f;--panel:#171e2b;--ink:#e6ebf5;--mute:#8d99b3;--line:#2a3345;--acc:#4fd1c5;--accbg:#173a3a;--warn:#f97066}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px}
button:hover{background:var(--accbg)}
button.pri{background:var(--acc);color:var(--bg);border-color:var(--acc);font-weight:700}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input,textarea,select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
.hide{display:none!important}
/* auth */
#auth{min-height:100%;display:grid;place-items:center;padding:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px;width:100%;max-width:380px}
.card h1{margin:0 0 4px;font-size:28px;letter-spacing:-.02em}
.card p{margin:0 0 18px;color:var(--mute)}
.card label{display:block;margin:12px 0 4px;font-size:14px;color:var(--mute)}
.card .row{display:flex;gap:8px;margin-top:18px}
.card .row button{flex:1}
#err{color:var(--warn);min-height:22px;margin-top:10px;font-size:14px}
/* app */
#app{height:100%;display:grid;grid-template-columns:210px 310px 1fr}
aside,section.list,main{background:var(--panel);min-height:0;overflow:auto}
aside{border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:4px}
aside h2{font-size:20px;margin:0 6px 10px;letter-spacing:-.02em}
aside h3{font-size:13px;color:var(--mute);margin:16px 8px 4px;font-weight:500}
.nav{display:block;width:100%;text-align:left;border:0;border-radius:8px;padding:6px 10px}
.nav.on{background:var(--accbg);color:var(--acc);font-weight:700}
.sp{flex:1}
.who{font-size:14px;color:var(--mute);margin:8px}
section.list{border-right:1px solid var(--line);display:flex;flex-direction:column}
.lh{padding:12px;display:flex;gap:8px;border-bottom:1px solid var(--line)}
#items{overflow:auto;flex:1}
.item{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.item:hover{background:var(--bg)}
.item.on{background:var(--accbg)}
.item b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item span{display:block;color:var(--mute);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item small{color:var(--mute)}
main{display:flex;flex-direction:column;padding:16px 22px;gap:10px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar input,.bar select{width:auto;flex:1;min-width:110px}
#title{font-size:24px;font-weight:700;border:0;padding:4px 0;background:none}
#body{flex:1;min-height:240px;resize:none;line-height:1.6}
#prev{flex:1;overflow:auto;line-height:1.7}
#prev h1,#prev h2,#prev h3{margin:.8em 0 .3em}
#prev code{background:var(--bg);padding:1px 5px;border-radius:4px}
#prev pre{background:var(--bg);padding:12px;border-radius:8px;overflow:auto}
#prev blockquote{margin:8px 0;padding-left:12px;border-left:3px solid var(--acc);color:var(--mute)}
#prev a{color:var(--acc)}
.aud{display:flex;gap:8px;align-items:center}
.aud audio{flex:1;height:36px;min-width:0}
.rec{background:var(--warn)!important;color:#fff!important}
#st{color:var(--mute);font-size:13px}
.back{display:none}
.empty{padding:40px 20px;text-align:center;color:var(--mute)}
@media(max-width:820px){
 #app{grid-template-columns:1fr}
 aside{flex-direction:row;flex-wrap:wrap;align-items:center;border-right:0;border-bottom:1px solid var(--line);max-height:38vh}
 aside h3{width:100%;margin:6px 4px 0}.nav{width:auto}.who{margin:0}
 #app>section.list{border-right:0}
 #app.editing>aside,#app.editing>section.list{display:none}
 #app:not(.editing)>main{display:none}
 .back{display:inline-block}
}
</style>
</head>
<body>
<div id="auth">
 <div class="card">
  <h1>NAHAD NOTES</h1>
  <p>Sign in to open your notes on any device.</p>
  <label for="u">Username</label><input id="u" autocomplete="username" autocapitalize="none">
  <label for="p">Password</label><input id="p" type="password" autocomplete="current-password">
  <div id="err" role="alert"></div>
  <div class="row"><button class="pri" id="login">Sign in</button><button id="reg">Create account</button></div>
</div></div>

<div id="app" class="hide">
 <aside>
  <h2>NAHAD NOTES</h2>
  <button class="pri" id="new">New note</button>
  <h3>Library</h3>
  <button class="nav on" data-f="all">All notes</button>
  <button class="nav" data-f="pin">Pinned</button>
  <h3>Folders</h3><div id="folders"></div>
  <h3>Tags</h3><div id="tags"></div>
  <div class="sp"></div>
  <div class="who" id="who"></div>
  <button id="theme">Switch theme</button>
  <button id="out">Sign out</button>
 </aside>
 <section class="list">
  <div class="lh"><input id="q" type="search" placeholder="Search notes" aria-label="Search notes"></div>
  <div id="items"></div>
 </section>
 <main id="ed">
  <div class="empty" id="none">Select a note or create a new one.</div>
  <div id="edit" class="hide" style="display:flex;flex-direction:column;gap:10px;flex:1;min-height:0">
   <div class="bar">
    <button class="back" id="back">Back</button>
    <button id="pin">Pin</button><button id="tog">Preview</button><button id="mic">Record voice</button>
    <button id="del" style="margin-left:auto">Delete</button>
   </div>
   <input id="title" placeholder="Untitled note" aria-label="Title">
   <div class="bar"><input id="folder" placeholder="Folder" list="fl" aria-label="Folder"><datalist id="fl"></datalist><input id="tg" placeholder="Tags, comma separated" aria-label="Tags"></div>
   <textarea id="body" placeholder="Write in Markdown…" aria-label="Note body"></textarea>
   <div id="prev" class="hide"></div>
   <div id="auds"></div>
   <div id="st"></div>
  </div>
 </main>
</div>

<script>
(function(){
var $=function(i){return document.getElementById(i)};
var user=null,notes=[],cur=null,filter={t:'all',v:''},timer=null,rec=null;
function g(k){try{return localStorage.getItem(k)}catch(e){return null}}
function s(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}
function esc(t){return t.replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
/* theme */
var th=g('nt:theme');if(th)document.documentElement.dataset.theme=th;
$('theme').onclick=function(){var d=document.documentElement,dark=getComputedStyle(d).getPropertyValue('--bg').trim()==='#10151f';d.dataset.theme=dark?'light':'dark';s('nt:theme',d.dataset.theme)};
/* auth */
function err(m){$('err').textContent=m}
async function api(m,u,b){
 var r=await fetch(u,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined,credentials:'same-origin'});
 var d={};try{d=await r.json()}catch(e){}
 if(!r.ok)throw new Error(d.error||'Something went wrong. Try again.');return d}
async function authGo(path){
 try{var d=await api('POST','/api/'+path,{username:$('u').value,password:$('p').value});await enter(d.username)}catch(e){err(e.message)}}
$('reg').onclick=function(){authGo('register')};
$('login').onclick=function(){authGo('login')};
$('p').onkeydown=function(e){if(e.key==='Enter')$('login').click()};
$('out').onclick=async function(){save();try{await api('POST','/api/logout')}catch(e){}user=null;cur=null;notes=[];$('app').classList.add('hide');$('auth').classList.remove('hide');$('p').value='';err('')};
async function enter(n){
 user=n;
 try{notes=await api('GET','/api/notes')}catch(e){err(e.message);return}
 $('auth').classList.add('hide');$('app').classList.remove('hide');$('who').textContent='Signed in as '+n;
 if(!notes.length){var w=mk();w.title='Welcome';w.body='# Welcome\n\nThis is your private space. Try:\n\n- **Bold**, *italic*, `code`\n- [ ] Checklists\n- Folders and tags in the sidebar\n- Voice notes with Record voice\n\n> Notes save automatically to your account.';notes.push(w);push(w)}
 filter={t:'all',v:''};$('q').value='';render();close_()}
function mk(){return{id:uid(),title:'',body:'',folder:'',tags:[],pin:false,aud:[],t:Date.now()}}
function push(n){
 if(!user)return;$('st').textContent='Saving…';
 api('PUT','/api/notes/'+n.id,n).then(function(){$('st').textContent='Saved'}).catch(function(e){$('st').textContent='Not saved: '+e.message})}
function persist(){if(cur)push(cur)}
function save(){if(cur){cur.title=$('title').value;cur.body=$('body').value;cur.folder=$('folder').value.trim();cur.tags=$('tg').value.split(',').map(function(x){return x.trim().toLowerCase()}).filter(Boolean);cur.t=Date.now();push(cur)}}
function queue(){$('st').textContent='Saving…';clearTimeout(timer);timer=setTimeout(function(){save();render()},500)}
['title','body','folder','tg'].forEach(function(i){$(i).oninput=queue});
/* list */
function vis(){
 var q=filter.v.toLowerCase();
 return notes.filter(function(n){
  if(filter.t==='pin'&&!n.pin)return false;
  if(filter.t==='folder'&&n.folder!==filter.v2)return false;
  if(filter.t==='tag'&&n.tags.indexOf(filter.v2)<0)return false;
  var sq=$('q').value.toLowerCase();
  return !sq||(n.title+' '+n.body+' '+n.tags.join(' ')).toLowerCase().indexOf(sq)>=0
 }).sort(function(a,b){return (b.pin-a.pin)||(b.t-a.t)})}
function render(){
 var list=vis(),h='';
 list.forEach(function(n){h+='<div class="item'+(cur&&cur.id===n.id?' on':'')+'" data-id="'+n.id+'" tabindex="0"><b>'+(n.pin?'📌 ':'')+esc(n.title||'Untitled note')+'</b><span>'+esc(n.body.replace(/[#*`>\-\[\]]/g,'').slice(0,80)||'No text yet')+'</span><small>'+new Date(n.t).toLocaleDateString()+(n.folder?' · '+esc(n.folder):'')+'</small></div>'});
 $('items').innerHTML=h||'<div class="empty">No notes here. Create one with New note.</div>';
 var f={},t={};notes.forEach(function(n){if(n.folder)f[n.folder]=1;n.tags.forEach(function(x){t[x]=1})});
 $('folders').innerHTML=Object.keys(f).map(function(x){return '<button class="nav'+(filter.t==='folder'&&filter.v2===x?' on':'')+'" data-f="folder" data-v="'+esc(x)+'">'+esc(x)+'</button>'}).join('')||'<div class="who">None yet</div>';
 $('tags').innerHTML=Object.keys(t).map(function(x){return '<button class="nav'+(filter.t==='tag'&&filter.v2===x?' on':'')+'" data-f="tag" data-v="'+esc(x)+'">#'+esc(x)+'</button>'}).join('')||'<div class="who">None yet</div>';
 $('fl').innerHTML=Object.keys(f).map(function(x){return '<option value="'+esc(x)+'">'}).join('');
 document.querySelectorAll('[data-f=all],[data-f=pin]').forEach(function(b){b.classList.toggle('on',filter.t===b.dataset.f)})}
document.addEventListener('click',function(e){
 var n=e.target.closest('.nav');
 if(n){filter={t:n.dataset.f,v:'',v2:n.dataset.v};render();return}
 var it=e.target.closest('.item');if(it)open_(it.dataset.id)});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.classList.contains('item'))open_(e.target.dataset.id)});
$('q').oninput=render;
/* editor */
function open_(id){
 save();cur=notes.filter(function(n){return n.id===id})[0];if(!cur)return;
 $('none').classList.add('hide');$('edit').classList.remove('hide');
 $('title').value=cur.title;$('body').value=cur.body;$('folder').value=cur.folder;$('tg').value=cur.tags.join(', ');
 $('pin').textContent=cur.pin?'Unpin':'Pin';showEdit();auds();$('st').textContent='';
 $('app').classList.add('editing');render()}
function close_(){cur=null;$('edit').classList.add('hide');$('none').classList.remove('hide');$('app').classList.remove('editing')}
$('back').onclick=function(){save();close_();render()};
$('new').onclick=function(){save();var n=mk();if(filter.t==='folder')n.folder=filter.v2;if(filter.t==='tag')n.tags=[filter.v2];notes.push(n);push(n);render();open_(n.id);$('title').focus()};
$('pin').onclick=function(){cur.pin=!cur.pin;$('pin').textContent=cur.pin?'Unpin':'Pin';save();render()};
$('del').onclick=function(){if(!confirm('Delete this note? This cannot be undone.'))return;var dn=cur;notes=notes.filter(function(n){return n!==dn});api('DELETE','/api/notes/'+dn.id).catch(function(){});cur=null;close_();render()};
function showEdit(){$('body').classList.remove('hide');$('prev').classList.add('hide');$('tog').textContent='Preview'}
$('tog').onclick=function(){
 if($('prev').classList.contains('hide')){save();$('prev').innerHTML=md(cur.body);$('prev').classList.remove('hide');$('body').classList.add('hide');$('tog').textContent='Edit'}else showEdit()};
function inl(t){return t.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\*([^*]+)\*/g,'<i>$1</i>').replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')}
function md(src){
 var out=[],lines=esc(src).split('\n'),inl_=false,code=false,li=false;
 function endl(){if(li){out.push('</ul>');li=false}}
 lines.forEach(function(l){
  if(/^```/.test(l)){endl();out.push(code?'</pre>':'<pre>');code=!code;return}
  if(code){out.push(l+'\n');return}
  var m;
  if(m=l.match(/^(#{1,3})\s+(.*)/)){endl();out.push('<h'+m[1].length+'>'+inl(m[2])+'</h'+m[1].length+'>');return}
  if(m=l.match(/^\s*[-*]\s+\[( |x)\]\s+(.*)/)){if(!li){out.push('<ul style="list-style:none;padding-left:4px">');li=true}out.push('<li>'+(m[1]==='x'?'☑ ':'☐ ')+inl(m[2])+'</li>');return}
  if(m=l.match(/^\s*[-*]\s+(.*)/)){if(!li){out.push('<ul>');li=true}out.push('<li>'+inl(m[1])+'</li>');return}
  endl();
  if(m=l.match(/^&gt;\s?(.*)/)){out.push('<blockquote>'+inl(m[1])+'</blockquote>');return}
  out.push(l.trim()?'<p>'+inl(l)+'</p>':'')});
 endl();return out.join('')}
/* voice */
function auds(){
 $('auds').innerHTML=cur.aud.map(function(a,i){return '<div class="aud"><audio controls src="'+a+'"></audio><button data-d="'+i+'" aria-label="Delete recording">Remove</button></div>'}).join('')}
$('auds').onclick=function(e){var d=e.target.dataset.d;if(d!==undefined){cur.aud.splice(+d,1);auds();save()}};
$('mic').onclick=async function(){
 if(rec){rec.stop();return}
 try{
  var st=await navigator.mediaDevices.getUserMedia({audio:true}),ch=[];
  rec=new MediaRecorder(st);
  rec.ondataavailable=function(e){ch.push(e.data)};
  rec.onstop=function(){
   st.getTracks().forEach(function(t){t.stop()});
   var r=new FileReader(),target=cur;
   r.onload=function(){target.aud.push(r.result);if(cur===target)auds();push(target)};
   r.readAsDataURL(new Blob(ch,{type:rec.mimeType}));
   rec=null;$('mic').textContent='Record voice';$('mic').classList.remove('rec')};
  rec.start();$('mic').textContent='Stop recording';$('mic').classList.add('rec')
 }catch(e){$('st').textContent='Microphone unavailable. Allow access in your browser, and use https.'}};
window.addEventListener('beforeunload',function(){if(cur){cur.title=$('title').value;cur.body=$('body').value;try{navigator.sendBeacon&&0}catch(e){}}});
api('GET','/api/me').then(function(d){return enter(d.username)}).catch(function(){});
})();
</script>
</body>
  </html>
